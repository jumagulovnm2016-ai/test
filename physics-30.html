<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Физика ультразвука — задачи на понимание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2; --panel:#F7F9FB; --ink:#15233A; --muted:#56667A; --line:#C9D3DD;
  --accent:#1E5FA8; --accent-soft:#DCE7F4; --ok:#1C7548; --ok-soft:#DDF0E5;
  --bad:#AE2A22; --bad-soft:#F7E1DF; --trace:#1E5FA8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1826; --panel:#172336; --ink:#E4EBF3; --muted:#9AA9BC; --line:#2B3B52;
    --accent:#6FA8E8; --accent-soft:#1D3150; --ok:#5CC98E; --ok-soft:#173627;
    --bad:#F08A80; --bad-soft:#3E1F1E; --trace:#6FA8E8;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1826; --panel:#172336; --ink:#E4EBF3; --muted:#9AA9BC; --line:#2B3B52;
  --accent:#6FA8E8; --accent-soft:#1D3150; --ok:#5CC98E; --ok-soft:#173627;
  --bad:#F08A80; --bad-soft:#3E1F1E; --trace:#6FA8E8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 48px}
h1{font:700 clamp(26px,6vw,38px)/1.1 "Unbounded","Onest",system-ui,sans-serif;letter-spacing:-.01em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px;font-size:16px}

/* A-mode trace: one spike per question */
.trace{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;margin-bottom:22px}
.trace svg{display:block;width:100%;height:64px}
.trace .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.trace .meta b{color:var(--ink);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px}
.qnum{font-size:14px;color:var(--muted);margin:0 0 8px}
.qtext{font-size:20px;font-weight:600;line-height:1.4;margin:0 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.key{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt.dim{opacity:.55}

.explain{margin-top:18px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:16px}
.explain strong{display:block;margin-bottom:4px}
.explain.ok{border-color:var(--ok)} .explain.bad{border-color:var(--bad)}
.actions{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;flex-wrap:wrap}
.btn{font:600 16px "Onest",system-ui,sans-serif;border-radius:10px;padding:12px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--panel)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.score{font:700 clamp(54px,14vw,88px)/1 "Unbounded","Onest",sans-serif;margin:4px 0 6px}
.verdict{font-size:18px;margin:0 0 20px;color:var(--muted)}
.review h2{font-size:18px;margin:26px 0 12px}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv p{margin:0 0 6px}
.rv .q{font-weight:600}
.rv .your{color:var(--bad)} .rv .right{color:var(--ok)}
.rv .why{color:var(--muted);font-size:15px}
.hint{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
@media (max-width:480px){.card{padding:20px 16px}.qtext{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.spike{transition:y .35s ease,height .35s ease}
</style>
<style>[hidden]{display:none!important}</style></head>
<body>
<main class="wrap">
  <h1>Физика ультразвука</h1>
  <p class="sub">30 задач на понимание: расчёты, причины артефактов, выбор настроек. После каждого ответа — разбор.</p>

  <div class="trace" aria-hidden="true">
    <svg id="trace" viewBox="0 0 400 64" preserveAspectRatio="none"></svg>
    <div class="meta"><span>Вопрос <b id="pos">1</b> из 30</span><span>Верно: <b id="okc">0</b></span></div>
  </div>

  <section class="card" id="card" aria-live="polite"></section>
  <p class="hint" id="hint">Можно отвечать клавишами 1–4, далее — Enter</p>
</main>

<script>
const Q = [
 {q:"Датчик 5 МГц, исследование мягких тканей. Какова длина волны?",
  o:["≈ 0,03 мм","≈ 0,31 мм","≈ 3,1 мм","≈ 7,7 мм"],a:1,
  e:"λ = c / f = 1540 м/с ÷ 5 000 000 Гц ≈ 0,000308 м ≈ 0,31 мм."},
 {q:"Датчик переключили с 3,5 на 7 МГц. Что произойдёт с длиной волны и глубиной проникновения?",
  o:["λ вдвое больше, глубина больше","λ вдвое меньше, глубина меньше","λ вдвое меньше, глубина больше","λ не меняется, меняется только яркость"],a:1,
  e:"Скорость в ткани постоянна, значит λ обратно пропорциональна f: частота ×2 → λ ÷2. Затухание растёт с частотой, поэтому глубина проникновения уменьшается."},
 {q:"Эхо вернулось к датчику через 65 мкс. На какой глубине отражатель?",
  o:["≈ 2,5 см","≈ 5 см","≈ 6,5 см","≈ 10 см"],a:1,
  e:"Правило 13 мкс: 1 см глубины = 13 мкс на путь туда и обратно. 65 ÷ 13 = 5 см."},
 {q:"Отражатель расположен на глубине 10 см. Через какое время вернётся эхо?",
  o:["≈ 13 мкс","≈ 65 мкс","≈ 130 мкс","≈ 1,3 мс"],a:2,
  e:"10 см × 13 мкс/см = 130 мкс. Это же время ограничивает, как часто можно посылать импульсы при такой глубине."},
 {q:"Луч проходит через толстый слой жира (скорость ≈ 1450 м/с), а аппарат считает по 1540 м/с. Где на экране окажутся структуры под жиром?",
  o:["Глубже, чем на самом деле","Ближе к датчику, чем на самом деле","На правильной глубине","Исчезнут с экрана"],a:0,
  e:"В жире звук медленнее, эхо возвращается позже. Аппарат переводит время в глубину по 1540 м/с и «решает», что отражатель дальше. Это артефакт ошибки скорости."},
 {q:"Пациент с выраженным ожирением. Линейным датчиком 12 МГц печень на глубине 14 см не видна. Какое действие логичнее всего?",
  o:["Взять датчик ещё большей частоты","Перейти на конвексный датчик 2–5 МГц","Уменьшить общее усиление","Уменьшить количество геля"],a:1,
  e:"Проблема в затухании: на 12 МГц энергия теряется задолго до 14 см. Снижение частоты уменьшает затухание и увеличивает глубину — ценой разрешения."},
 {q:"Затухание 0,5 дБ/(см·МГц), датчик 4 МГц, отражатель на глубине 5 см. Каково суммарное затухание эха (путь туда и обратно)?",
  o:["2 дБ","10 дБ","20 дБ","40 дБ"],a:2,
  e:"В одну сторону: 0,5 × 4 × 5 = 10 дБ. Эхо проходит путь дважды (10 см), итого 20 дБ."},
 {q:"Две соседние ткани имеют разную плотность, но одинаковый акустический импеданс. Что будет на границе между ними?",
  o:["Сильное отражение — яркая линия","Отражения практически не будет — граница не видна","Акустическая тень","Реверберация"],a:1,
  e:"Отражение определяется разницей импедансов (Z = ρ·c), а не плотностью самой по себе. Если Z равны, энергия проходит без отражения — граница эхографически не видна."},
 {q:"Почему у взрослого нельзя оценить средостение через лёгочную ткань?",
  o:["Лёгкое слишком сильно поглощает УЗ из-за крови","На границе ткань–воздух отражается почти вся энергия","Скорость звука в лёгком выше, чем в кости","Мешает доплеровский сдвиг от дыхания"],a:1,
  e:"Импеданс воздуха отличается от тканей в тысячи раз, поэтому граница с воздухом отражает почти 100% энергии. Дальше луч не проходит — тот же принцип, что и с воздухом под датчиком без геля."},
 {q:"За образованием видно дистальное усиление эхосигнала. Какой вывод наиболее обоснован?",
  o:["Образование плотное, кальцинированное","Образование содержит газ","Образование слабо затухает УЗ — вероятно, жидкостное","Аппарат неисправен"],a:2,
  e:"Усиление за объектом означает, что он затухает меньше окружающих тканей. Это типично для жидкости. Но признак не абсолютный: некоторые солидные образования тоже дают усиление, поэтому это «вероятно», а не «точно»."},
 {q:"Две структуры лежат одна за другой по ходу луча на расстоянии 0,2 мм. Пространственная длина импульса 0,6 мм. Будут ли они видны раздельно?",
  o:["Да, 0,2 мм меньше длины импульса","Нет, аксиальное разрешение 0,3 мм, структуры сольются","Да, если увеличить усиление","Зависит только от ширины луча"],a:1,
  e:"Аксиальное разрешение = длина импульса ÷ 2 = 0,3 мм. Расстояние 0,2 мм меньше, эхо от двух структур перекроется и сольётся в одно."},
 {q:"Фокус выставлен на 3 см. На глубине 8 см две рядом лежащие точки сливаются в одну. Что исправит ситуацию в первую очередь?",
  o:["Перенести фокус на 8 см","Увеличить общее усиление","Уменьшить глубину сканирования до 5 см","Включить цветовой доплер"],a:0,
  e:"Точки лежат рядом на одной глубине — это латеральное разрешение, оно зависит от ширины луча. Луч самый узкий в фокусе, поэтому фокус нужно поставить на уровень интереса."},
 {q:"Сильный отражатель расположен на глубине 1 см. Где появятся реверберационные линии?",
  o:["На 0,5; 1,5; 2,5 см","На 2, 3, 4 см и далее","Только на 2 см","Случайно по всему изображению"],a:1,
  e:"Импульс «прыгает» между датчиком и отражателем. Каждый лишний проход добавляет 1 см кажущейся глубины, поэтому линии идут с шагом, равным глубине отражателя: 2, 3, 4 см."},
 {q:"Образование в печени видно также «за» диафрагмой, в проекции лёгкого. Почему копия изображена глубже оригинала?",
  o:["Звук в лёгком идёт быстрее","Эхо отразилось от диафрагмы, путь удлинился, а аппарат считает его прямым","Это рефракция на рёбрах","Аппарат дублирует кадр при высокой частоте кадров"],a:1,
  e:"Зеркальный артефакт: луч отражается от диафрагмы как от зеркала, попадает в образование и возвращается тем же путём. Время больше, а аппарат считает, что эхо пришло по прямой, — и рисует копию дальше."},
 {q:"Ближняя половина изображения нормальной яркости, дальняя — заметно темнее. Какая регулировка наиболее уместна?",
  o:["Снизить общее усиление","Увеличить TGC на глубине","Увеличить частоту датчика","Перенести фокус к поверхности"],a:1,
  e:"Потемнение с глубиной — это некомпенсированное затухание. TGC усиливает сигнал выборочно по глубине. Общее усиление пересветит ближнюю зону, а повышение частоты усугубит затухание."},
 {q:"Изображение слишком тёмное. По принципу ALARA что разумнее сделать сначала?",
  o:["Увеличить выходную мощность","Увеличить усиление (Gain)","Уменьшить количество геля","Увеличить частоту датчика"],a:1,
  e:"Gain усиливает уже принятый сигнал и не меняет энергию, которую получает пациент. Мощность (Output) повышает экспозицию. Поэтому сначала усиление, мощность — в последнюю очередь."},
 {q:"Сосуд идёт параллельно коже, линейный датчик стоит перпендикулярно. Доплеровский сигнал почти отсутствует. В чём причина и что делать?",
  o:["Кровоток слишком быстрый, снизить частоту","Угол ≈ 90°, cos θ ≈ 0 — наклонить луч (steer) или датчик","Мало геля, добавить","Слишком большая глубина, увеличить мощность"],a:1,
  e:"Доплеровский сдвиг пропорционален cos θ. При 90° cos = 0, сдвига нет. Нужно создать угол: наклонить луч или датчик, желательно до ≤ 60°."},
 {q:"Скорость кровотока не изменилась, а угол между лучом и потоком изменили с 0° до 60°. Что произойдёт с доплеровским сдвигом?",
  o:["Не изменится","Уменьшится вдвое","Увеличится вдвое","Станет равным нулю"],a:1,
  e:"cos 0° = 1, cos 60° = 0,5. Сдвиг пропорционален cos θ, значит уменьшится вдвое. Поэтому для расчёта скорости аппарату нужна угловая коррекция."},
 {q:"Глубину сканирования увеличили с 10 до 20 см. Что произойдёт с максимальной частотой повторения импульсов (PRF)?",
  o:["Увеличится","Уменьшится","Не изменится","Станет равной частоте датчика"],a:1,
  e:"Следующий импульс нельзя послать, пока не вернулось эхо с максимальной глубины. Глубже — дольше ждать (130 → 260 мкс), значит импульсов в секунду меньше."},
 {q:"Нужно повысить частоту кадров при эхокардиографии. Какое действие поможет?",
  o:["Увеличить глубину сканирования","Добавить больше фокусных зон","Уменьшить глубину и сузить сектор","Увеличить общее усиление"],a:2,
  e:"Кадр строится из линий, а каждая линия требует времени на возврат эха. Меньше глубина — меньше время на линию, уже сектор — меньше линий. Несколько фокусных зон, наоборот, снижают частоту кадров."}
 ,{q:"Датчик работает на частоте 2 МГц. Каков период колебаний?",
  o:["0,2 мкс","0,5 мкс","2 мкс","5 мкс"],a:1,
  e:"Период T = 1 / f = 1 ÷ 2 000 000 Гц = 0,0000005 с = 0,5 мкс."},
 {q:"Импеданс печени ≈ 1,65, почки ≈ 1,62 МРэл. Какая доля энергии отразится на их границе? (R = ((Z₂−Z₁)/(Z₂+Z₁))²)",
  o:["≈ 0,01%","≈ 10%","≈ 50%","≈ 99%"],a:0,
  e:"(0,03 ÷ 3,27)² ≈ 0,0001, то есть около 0,01%. Границы мягких тканей отражают крайне мало — поэтому луч проходит глубоко, а слабые эхо требуют большого усиления."},
 {q:"При каком условии луч не преломляется на границе двух сред с разной скоростью звука?",
  o:["При падении под углом 45°","При перпендикулярном падении на границу","При высокой частоте датчика","Преломление происходит всегда"],a:1,
  e:"По закону Снелла при угле падения 0° (перпендикулярно) направление луча не меняется. Чем косее падение и больше разница скоростей, тем сильнее преломление."},
 {q:"В просвете желчного пузыря у стенки видна «взвесь». Она не смещается при повороте пациента, но исчезает при изменении угла сканирования. Наиболее вероятное объяснение?",
  o:["Истинный сладж","Артефакт толщины (ширины) луча","Акустическая тень","Ошибка скорости звука"],a:1,
  e:"Настоящий сладж подвижен и перемещается под действием силы тяжести. Эхо, которое зависит от положения датчика, — это соседняя ткань, попавшая в широкий луч и «наложенная» на жидкость."},
 {q:"За мелким ярким отражателем в стенке желчного пузыря — короткий сужающийся яркий «хвост». Это разновидность какого артефакта?",
  o:["Акустической тени","Дистального усиления","Реверберации (хвост кометы)","Зеркального артефакта"],a:2,
  e:"Хвост кометы — реверберация внутри очень мелкого сильного отражателя: повторные эхо идут так близко, что сливаются в сплошной сужающийся хвост."},
 {q:"PRF в спектральном доплере равна 4 кГц. Какой максимальный доплеровский сдвиг регистрируется без алиасинга?",
  o:["1 кГц","2 кГц","4 кГц","8 кГц"],a:1,
  e:"Предел Найквиста = PRF ÷ 2 = 2 кГц. Сдвиг выше этой величины «заворачивается» на противоположную сторону спектра — это алиасинг."},
 {q:"В спектре появился алиасинг. Какое действие его устранит?",
  o:["Увеличить частоту датчика","Увеличить шкалу скоростей (PRF)","Увеличить усиление","Увеличить глубину сканирования"],a:1,
  e:"Больше PRF — выше предел Найквиста. Повышение частоты датчика, наоборот, увеличит сдвиг, а большая глубина снизит допустимую PRF. Также помогают сдвиг базовой линии и датчик меньшей частоты."},
 {q:"В режиме ЦДК сосуд окрашен красным. Можно ли по этому признаку утверждать, что это артерия?",
  o:["Да, красный всегда означает артерию","Нет, цвет отражает направление потока относительно датчика","Да, если сосуд пульсирует","Нет, красный означает турбулентность"],a:1,
  e:"Цвет кодирует направление к датчику или от него, и шкалу можно инвертировать. Тип сосуда определяют по спектру (пульсативность), анатомии и ходу, а не по цвету."},
 {q:"В режиме тканевой гармоники датчик излучает 2 МГц, а принимает 4 МГц. Почему снижаются артефакты в ближней зоне?",
  o:["Потому что 4 МГц проникает глубже","Гармоники формируются по мере прохождения через ткань и почти не возникают у поверхности и в боковых лепестках","Потому что снижается мощность излучения","Потому что увеличивается длина волны"],a:1,
  e:"Гармоники рождаются из-за нелинейного распространения мощного центрального пучка в ткани. У самой поверхности и в слабых боковых лепестках их мало, поэтому реверберации и шум вблизи датчика подавляются."},
 {q:"Все структуры выглядят зернистыми и «шумными», а в просвете сосудов и кист появился серый фон. Что вероятнее всего изменено?",
  o:["Слишком низкое усиление","Слишком высокое усиление","Слишком низкая частота кадров","Фокус выставлен слишком глубоко"],a:1,
  e:"Чрезмерное усиление поднимает слабые сигналы и шум до видимого уровня: анэхогенные полости «засоряются» эхо. Решение — снизить общее усиление или TGC."}
];

const $ = s => document.querySelector(s);
const card = $("#card"), trace = $("#trace");
let order, idx, results, answered, optMap;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawTrace(){
  const w=400,h=64,n=Q.length,step=w/n;
  let s=`<line x1="0" y1="${h-2}" x2="${w}" y2="${h-2}" stroke="var(--line)" stroke-width="1.5"/>`;
  for(let i=0;i<n;i++){
    const r=results[i], x=i*step+step/2-3;
    let ht=4, col="var(--line)";
    if(r===true){ht=56;col="var(--ok)"} else if(r===false){ht=18;col="var(--bad)"}
    else if(i===idx){ht=10;col="var(--trace)"}
    s+=`<rect class="spike" x="${x}" y="${h-2-ht}" width="6" height="${ht}" rx="2" fill="${col}"/>`;
  }
  trace.innerHTML=s;
  $("#pos").textContent=Math.min(idx+1,n);
  $("#okc").textContent=results.filter(r=>r===true).length;
}

function start(){
  order=shuffle(Q.map((_,i)=>i));
  results=Array(Q.length).fill(null);
  idx=0; render();
}

function render(){
  answered=false;
  const q=Q[order[idx]];
  optMap=shuffle(q.o.map((_,i)=>i));
  card.innerHTML=`
    <p class="qnum">Вопрос ${idx+1}</p>
    <p class="qtext">${q.q}</p>
    <ul class="opts">${optMap.map((oi,k)=>`
      <li><button class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${q.o[oi]}</span></button></li>`).join("")}
    </ul>
    <div id="after"></div>`;
  card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k)));
  drawTrace();
  card.querySelector(".opt").focus({preventScroll:true});
}

function choose(k){
  if(answered)return; answered=true;
  const q=Q[order[idx]], picked=optMap[k], ok=picked===q.a;
  results[idx]=ok; q._picked=picked;
  card.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;
    if(optMap[i]===q.a)b.classList.add("correct");
    else if(i===k)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last=idx===Q.length-1;
  $("#after").innerHTML=`
    <div class="explain ${ok?"ok":"bad"}"><strong>${ok?"Верно":"Неверно"}</strong>${q.e}</div>
    <div class="actions"><button class="btn" id="next">${last?"Показать результат":"Следующий вопрос"}</button></div>`;
  const nx=$("#next"); nx.addEventListener("click",next); nx.focus({preventScroll:true});
  drawTrace();
}

function next(){ idx++; idx<Q.length?render():finish(); }

function finish(){
  const n=Q.length, ok=results.filter(Boolean).length, pct=Math.round(ok/n*100);
  const verdict = pct>=90?"Отличный уровень базовой физики.":pct>=70?"Хорошо, но есть темы для повторения.":pct>=50?"Удовлетворительно — стоит повторить разделы с ошибками.":"Базовые понятия нужно пройти заново.";
  const wrong=order.map((qi,i)=>({q:Q[qi],ok:results[i]})).filter(r=>!r.ok);
  card.innerHTML=`
    <p class="qnum">Результат</p>
    <p class="score">${ok}/${n}</p>
    <p class="verdict">${pct}% · ${verdict}</p>
    ${wrong.length?`<div class="review"><h2>Разбор ошибок (${wrong.length})</h2>${wrong.map(r=>`
      <div class="rv"><p class="q">${r.q.q}</p>
      <p class="your">Ваш ответ: ${r.q.o[r.q._picked]}</p>
      <p class="right">Правильно: ${r.q.o[r.q.a]}</p>
      <p class="why">${r.q.e}</p></div>`).join("")}</div>`:`<p>Ошибок нет.</p>`}
    <div class="actions"><button class="btn" id="again">Пройти заново</button></div>`;
  $("#again").addEventListener("click",()=>{start();window.scrollTo(0,0)});
  idx=n; drawTrace(); $("#pos").textContent=n;
}

document.addEventListener("keydown",e=>{
  if(idx>=Q.length)return;
  if(!answered && /^[1-4]$/.test(e.key)){choose(+e.key-1)}
  else if(answered && e.key==="Enter" && document.activeElement?.id!=="next"){e.preventDefault();next()}
});

start();
</script>
<script>window.TG_CFG={title:'Физика ультразвука — 30 задач на понимание',needFio:true,getReport:function(){function v(e){return e&&e.getClientRects().length>0} var a=document.getElementById('again'),s=document.querySelector('.score');if(!v(a)||!v(s))return null;var vd=document.querySelector('.verdict'),r=document.querySelector('.review h2');return 'Результат: '+s.innerText+' — '+(vd?vd.innerText:'')+'\n'+(r?r.innerText:'Ошибок нет');}};</script><script src="tg.js"></script>
</body>
</html>
