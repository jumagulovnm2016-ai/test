<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Мультик-учебник: как устроен компьютер — процессор, оперативка, накопители, видеокарта, BIOS, разгон и сборка.">
<title>Кухня внутри ПК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: comic-strip player (stage + speech bubble) beside a study column; stacks on phones */
:root{
  --paper:#F4F7F1; --card:#FFFFFF; --ink:#1D2939; --muted:#5B6878; --line:#DCE3D8;
  --wall:#E6F0FA; --wall2:#D5E4F3;
  --stroke:#1D2939; --eye:#1D2939; --hat:#FFFFFF;
  --yel:#FFC43D; --yel2:#F2A922; --grn:#2E9D68; --mint:#7ED9B0; --gold:#E7B422; --chip:#2A2F38;
  --blue:#4A8BF5; --blue2:#A9C8FF; --coral:#FF6B57; --red:#E5484D; --wood:#C98B50; --wood2:#B07540;
  --gray:#8D99A8; --scr:#DDE7F3; --night:#0B1020;
  --ok:#1F8A57; --okbg:#E1F5EA; --bad:#C9353B; --badbg:#FDE8E8;
  --f-disp:"Comfortaa","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161F; --card:#19212D; --ink:#E6ECF4; --muted:#9AA7B6; --line:#2A3443;
  --wall:#18222F; --wall2:#202D3E; --stroke:#C3CDD9; --hat:#F3F5F8; --chip:#0C0F14;
  --grn:#2B8F5F; --gray:#6E7A89; --scr:#26364A; --wood:#A8713F; --wood2:#8C5D33; --night:#000000;
  --ok:#5BD29A; --okbg:#173326; --bad:#FF8A8F; --badbg:#3A1C20; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161F; --card:#19212D; --ink:#E6ECF4; --muted:#9AA7B6; --line:#2A3443;
  --wall:#18222F; --wall2:#202D3E; --stroke:#C3CDD9; --hat:#F3F5F8; --chip:#0C0F14;
  --grn:#2B8F5F; --gray:#6E7A89; --scr:#26364A; --wood:#A8713F; --wood2:#8C5D33; --night:#000000;
  --ok:#5BD29A; --okbg:#173326; --bad:#FF8A8F; --badbg:#3A1C20; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.2}
.top{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-size:clamp(28px,5vw,44px);font-weight:700}
.lede{margin:0;color:var(--muted);max-width:60ch;grid-column:1}
.progress{grid-column:2;grid-row:1/4;min-width:180px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.progress .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;border:1.5px solid var(--stroke)}
.progress .bar i{display:block;height:100%;background:var(--grn);width:0;transition:width .5s}
@media (max-width:640px){.top{grid-template-columns:1fr}.progress{grid-column:1;grid-row:auto}}

.eps{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2px solid var(--stroke);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 14px 6px 6px;font:700 14px/1.2 var(--f-body);cursor:pointer;box-shadow:2px 2px 0 var(--stroke);transition:transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--wall2);font-family:var(--f-mono);font-size:13px}
.chip.cur{background:var(--yel);color:#1D2939}
.chip.cur .n{background:#fff}
.chip.done .n{background:var(--grn);color:#fff}
.chip.done .n::after{content:"✓"}
.chip.done .n span{display:none}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.player{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:901px){.player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.ephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.epnum{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
h2{font-size:clamp(20px,3vw,26px)}
.stage{border:3px solid var(--stroke);border-radius:18px;box-shadow:5px 5px 0 var(--stroke);overflow:hidden;
  background-color:var(--wall);background-image:linear-gradient(var(--wall2) 1px,transparent 1px),linear-gradient(90deg,var(--wall2) 1px,transparent 1px);background-size:22px 22px}
.stage svg{display:block;width:100%;height:auto}
.sub{position:relative;background:var(--card);border:2.5px solid var(--stroke);border-radius:16px;padding:14px 18px;min-height:96px;box-shadow:3px 3px 0 var(--stroke)}
.sub::before{content:"";position:absolute;left:34px;top:-12px;width:18px;height:18px;background:var(--card);border-left:2.5px solid var(--stroke);border-top:2.5px solid var(--stroke);transform:rotate(45deg)}
.sub p{margin:0;font-size:17px;font-weight:600;max-width:65ch}
.sub b{font-weight:800;color:var(--grn)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--stroke);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 16px;font:800 15px/1 var(--f-body);cursor:pointer;box-shadow:2px 2px 0 var(--stroke)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.primary{background:var(--grn);color:#fff}
.btn.on{background:var(--yel);color:#1D2939}
.dots{display:flex;gap:6px;flex:1;justify-content:center;min-width:60px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--stroke);background:transparent}
.dots i.cur{background:var(--yel)}
.dots i.seen{background:var(--stroke)}

.learn{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:18px;margin-bottom:10px}
.remember{border:2px dashed var(--grn)}
.remember ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.remember li{font-weight:700}
.deep p,.deep li{color:var(--ink);font-size:15px}
.deep p{margin:0 0 10px}
.deep ul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.deep code,.mono{font-family:var(--f-mono);font-size:.9em;background:var(--wall);padding:1px 5px;border-radius:5px}
.tbl{overflow-x:auto;margin:6px 0 10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td:nth-child(n+2){font-family:var(--f-mono);font-size:13px}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0;margin-bottom:6px}
.q p{margin:0;font-weight:800}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 12px;font:600 15px/1.35 var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--stroke)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{font-size:14px;margin:0;color:var(--muted)}
.why b{color:var(--ok)}
.why.no b{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:600 13px var(--f-body);cursor:pointer;padding:0}
.nextep{align-self:flex-start}

/* SVG cartoon */
.o{stroke:var(--stroke);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.o1{stroke:var(--stroke);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.nf{fill:none}
.f-yel{fill:var(--yel)}.f-yel2{fill:var(--yel2)}.f-grn{fill:var(--grn)}.f-mint{fill:var(--mint)}.f-gold{fill:var(--gold)}
.f-chip{fill:var(--chip)}.f-hat{fill:var(--hat)}.f-eye{fill:var(--eye)}.f-coral{fill:var(--coral)}.f-blue{fill:var(--blue)}
.f-blue2{fill:var(--blue2)}.f-wood{fill:var(--wood)}.f-wood2{fill:var(--wood2)}.f-gray{fill:var(--gray)}.f-card{fill:var(--card)}
.f-line{fill:var(--line)}.f-red{fill:var(--red)}.f-paper{fill:var(--paper)}.f-scr{fill:var(--scr)}.f-night{fill:var(--night)}.f-wall{fill:var(--wall)}
.t{font-family:var(--f-body);font-weight:800;fill:var(--ink);font-size:10px;text-anchor:middle}
.tm{font-family:var(--f-mono);font-weight:700}
.td{font-family:var(--f-disp);font-weight:700}
.tl{text-anchor:start}.te{text-anchor:end}
.tw{fill:#fff}.tk{fill:var(--eye)}.tr{fill:var(--red)}
.tchip{font-family:var(--f-mono);font-size:8px;font-weight:700;fill:var(--eye);text-anchor:middle}
.lab{paint-order:stroke;stroke:var(--wall);stroke-width:3.5px;stroke-linejoin:round}
.trace{fill:none;stroke:var(--gold);stroke-width:1.6;opacity:.85}
.wire{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-linecap:round}
.air{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round}
.road{fill:none;stroke:var(--gray);stroke-width:9;stroke-linecap:round;opacity:.55}
.heat{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-linecap:round}
.hl{fill:none;stroke:var(--coral);stroke-width:3}
.hlline{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:3 3}
.px{fill:var(--scr)}

.actor{transition:opacity .35s}
.dim .actor:not(.on){opacity:.2}
.actor.on{transform-box:fill-box;transform-origin:50% 100%;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.slow{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}
.hand{transform-box:fill-box;transform-origin:50% 100%;animation:spin 2s linear infinite}
.fast .hand{animation-duration:.25s}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.armL,.armR{transform-box:fill-box;animation:stir 1.1s ease-in-out infinite alternate}
.armL{transform-origin:100% 0}.armR{transform-origin:0 0}
@keyframes stir{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.fast .armL,.fast .armR{animation-duration:.13s}
.mv{animation:mv var(--t,2.6s) ease-in-out infinite}
@keyframes mv{0%,10%{transform:translate(0,0);opacity:1}60%,88%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:0}}
.rise{animation:rise 2.4s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.swap #cpu{animation:run 2.8s ease-in-out infinite;--dx:-150px}
@keyframes run{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(var(--dx))}}
.off .dc{transform-box:fill-box;transform-origin:center;animation:fall 1.1s .5s ease-in forwards}
@keyframes fall{to{transform:translateY(46px) rotate(30deg);opacity:0}}
.shade{animation:shade .8s forwards}
@keyframes shade{from{opacity:0}to{opacity:.6}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.flow{stroke-dasharray:6 6;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.seek{transform-box:fill-box;transform-origin:100% 100%;animation:seek .45s ease-in-out infinite alternate}
@keyframes seek{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
.press{animation:press 1.4s ease-in-out infinite}
@keyframes press{0%,30%,100%{transform:translateY(0)}45%,60%{transform:translateY(4px)}}
.pxw{animation:pxw 2.4s ease-in-out infinite}
@keyframes pxw{0%,100%{fill:var(--scr)}45%{fill:var(--blue)}60%{fill:var(--coral)}}
.tok{fill:var(--ok)}
.appear{animation:appear .5s both}
@keyframes appear{from{opacity:0}to{opacity:1}}
.needle{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-55deg);transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.oc .needle{transform:rotate(28deg)}.volt .needle{transform:rotate(52deg)}.xmp .needle{transform:rotate(-50deg)}
.crash .needle{animation:wob .25s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(68deg)}to{transform:rotate(86deg)}}
.therm{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.35);transition:transform .9s}
.oc .therm{transform:scaleY(.6)}.volt .therm{transform:scaleY(.85)}.crash .therm{transform:scaleY(1)}.xmp .therm{transform:scaleY(.37)}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}.actor{transition:none}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">Мультик-учебник · 12 серий</p>
    <h1>Кухня внутри ПК</h1>
    <p class="lede">Как устроен компьютер — от «что такое оперативка» до цифр на наклейке планки. Каждая деталь здесь — герой на кухне ресторана. Смотри кадры, читай «Взрослым словами», отвечай на вопросы.</p>
    <div class="progress"><span id="prog">Пройдено 0 из 9</span><div class="bar"><i id="progbar"></i></div></div>
  </header>

  <nav class="eps" id="eps" aria-label="Серии"></nav>

  <main class="grid">
    <section class="player" aria-live="polite">
      <div class="ephead"><span class="epnum" id="epnum"></span><h2 id="eptitle"></h2></div>
      <div class="stage" id="stage"></div>
      <div class="sub"><p id="subtext"></p></div>
      <div class="controls">
        <button class="btn" id="prev" type="button">Назад</button>
        <div class="dots" id="dots"></div>
        <button class="btn" id="play" type="button">Авто</button>
        <button class="btn primary" id="next" type="button">Дальше</button>
      </div>
    </section>
    <aside class="learn">
      <section class="card remember"><h3>Запомни</h3><ul id="rem"></ul></section>
      <section class="card deep"><h3>Взрослым словами</h3><div id="deep"></div></section>
      <section class="card quiz"><h3>Проверь себя</h3><div id="quiz"></div></section>
      <button class="btn primary nextep" id="nextep" type="button"></button>
    </aside>
  </main>
</div>

<script>
/* ---------- drawing helpers ---------- */
const W=(inner,a='')=>`<g ${a}>${inner}</g>`;
const T=(x,y,s,c='',st='')=>`<text x="${x}" y="${y}" class="t ${c}"${st?` style="${st}"`:''}>${s}</text>`;
const face=(cx,cy)=>`<g class="blink"><circle cx="${cx-8}" cy="${cy}" r="3" class="f-eye"/><circle cx="${cx+8}" cy="${cy}" r="3" class="f-eye"/></g><path d="M${cx-6} ${cy+7}q6 5 12 0" class="o nf"/><circle cx="${cx-14}" cy="${cy+6}" r="3" class="f-coral" opacity=".45"/><circle cx="${cx+14}" cy="${cy+6}" r="3" class="f-coral" opacity=".45"/>`;
function chef(x,y,s=1,a=''){
  let pins='';for(let i=0;i<4;i++){const p=8+i*11;pins+=`<path d="M-6 ${p}h6M50 ${p}h6" class="o"/>`}
  return W(`<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M17 50v22M33 50v22M11 72h8M31 72h8" class="o nf"/>
  <g class="armL"><path d="M2 26q-14 6-14 20" class="o nf"/><circle cx="-12" cy="48" r="4.5" class="f-hat o"/></g>
  <g class="armR"><path d="M48 26q14 6 14 20" class="o nf"/><circle cx="62" cy="48" r="4.5" class="f-hat o"/></g>
  ${pins}<rect width="50" height="50" rx="8" class="f-yel o"/>
  <rect x="10" y="33" width="30" height="11" rx="2" class="f-yel2"/><text x="25" y="41.5" class="tchip">CPU</text>
  ${face(25,18)}
  <circle cx="13" cy="-9" r="8" class="f-hat o"/><circle cx="37" cy="-9" r="8" class="f-hat o"/><circle cx="25" cy="-14" r="10" class="f-hat o"/><rect x="8" y="-7" width="34" height="8" rx="2" class="f-hat o"/>
  </g>`,a);
}
function desk(x,y,w,a='',lab=''){
  let c='',k='';const n=Math.floor((w-6)/24);
  for(let i=0;i<n;i++)c+=`<rect x="${6+i*24}" y="4" width="16" height="10" rx="1.5" class="f-chip"/>`;
  for(let i=5;i<w-5;i+=5)k+=`<rect x="${i}" y="17" width="3" height="5" class="f-gold"/>`;
  return W(`<g transform="translate(${x} ${y})"><path d="M8 20v30M${w-8} 20v30M4 50h8M${w-12} 50h8" class="o nf"/>${k}<rect width="${w}" height="18" rx="3" class="f-grn o"/>${c}${lab?T(w/2,34,lab,'lab'):''}</g>`,a);
}
const crateIn=(x,y,c)=>`<g transform="translate(${x} ${y})"><rect width="18" height="14" rx="2" class="${c} o"/><path d="M0 5h18M9 5v9" class="o1 nf"/></g>`;
const crate=(x,y,c='f-coral',a='')=>W(crateIn(x,y,c),a);
function cupboard(x,y,s=1,a='',lab=''){
  return W(`<g transform="translate(${x} ${y}) scale(${s})"><rect width="70" height="100" rx="4" class="f-wood o"/><rect x="6" y="6" width="58" height="88" rx="2" class="f-wood2"/><path d="M6 36h58M6 66h58" class="o nf"/>
  ${crateIn(10,22,'f-coral')}${crateIn(34,22,'f-blue')}${crateIn(12,52,'f-mint')}${crateIn(38,52,'f-yel')}${crateIn(16,80,'f-blue')}${crateIn(40,80,'f-coral')}
  ${lab?T(35,-7,lab,'lab'):''}</g>`,a);
}
const fanIn=(cx,cy,r,cls='spin')=>`<g transform="translate(${cx} ${cy})"><circle r="${r}" class="f-card o"/><g class="${cls}">${[0,90,180,270].map(d=>`<ellipse cx="${(r*.45).toFixed(1)}" rx="${(r*.42).toFixed(1)}" ry="${(r*.17).toFixed(1)}" transform="rotate(${d})" class="f-blue2"/>`).join('')}</g><circle r="${(r*.22).toFixed(1)}" class="f-eye"/></g>`;
function gpu(x,y,s=1,a='',lab=''){
  return W(`<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M20 38v18M46 38v18M14 56h10M40 56h10" class="o nf"/>
  <g class="armR"><path d="M64 18q8-2 9-10" class="o nf"/><circle cx="73" cy="6" r="3.5" class="f-coral o"/></g>
  <rect x="-4" y="3" width="5" height="32" class="f-gray o1"/>
  <rect width="66" height="38" rx="5" class="f-blue o"/>${fanIn(20,19,13)}
  <g class="blink"><circle cx="41" cy="14" r="2.4" class="f-eye"/><circle cx="53" cy="14" r="2.4" class="f-eye"/></g><path d="M42 21q5 4 10 0" class="o nf"/>
  <ellipse cx="47" cy="-2" rx="14" ry="5" class="f-coral o"/><circle cx="47" cy="-8" r="2.5" class="f-coral o"/>

remember:['Объём (ГБ), поколение (DDR4/DDR5), скорость (МТ/с), тайминг (CL)','DDR4 и DDR5 не взаимозаменяемы','Две одинаковые планки лучше одной','После установки включи XMP или EXPO в BIOS'],
deep:`<ul>
<li><b>Реальная задержка в наносекундах</b> = CL × 2000 ÷ скорость. DDR4-3200 CL16 → 16 × 2000 ÷ 3200 = <b>10 нс</b>. DDR5-6000 CL30 → 30 × 2000 ÷ 6000 = <b>10 нс</b>. Отклик почти одинаковый! DDR5 выигрывает не в задержке, а в пропускной способности.</li>
<li><b>Пропускная способность канала</b> = скорость × 8 байт. DDR4-3200 ≈ 25,6 ГБ/с, DDR5-6000 ≈ 48 ГБ/с. Два канала — вдвое больше.</li>
<li><b>МГц или МТ/с?</b> DDR — Double Data Rate, две передачи за такт. DDR4-3200 физически работает на 1600 МГц, и программа CPU-Z честно покажет 1600. Это не брак.</li>
<li><b>XMP (Intel) / EXPO (AMD).</b> По умолчанию планка стартует на базовой скорости (DDR4 обычно 2133–2400, DDR5 — 4800–5600). Заявленные 6000 включаются профилем в BIOS.</li>
<li><b>Куда ставить две планки</b> в плату с 4 слотами: обычно во 2-й и 4-й слот от процессора (A2 и B2). Точно — в инструкции к плате.</li>
<li><b>Ноутбуки:</b> планки короче (SO-DIMM), а в тонких моделях память часто распаяна — добавить нельзя. Проверь до покупки.</li></ul>`,
quiz:[
 {q:'Можно ли вставить планку DDR4 в слот DDR5?',a:['Да, просто будет медленнее','Нет, вырез-ключ в другом месте','Да, через переходник'],c:1,w:'Поколения физически и электрически несовместимы.'},
 {q:'Что быстрее для обычного ПК?',a:['Одна планка 16 ГБ','Две планки по 8 ГБ','Одинаково'],c:1,w:'Две планки включают двухканальный режим — две дороги к процессору.'},

]},

deep:`<ul>
<li><b>Скорость чтения подряд:</b> HDD 100–250 МБ/с; SATA SSD около 550 МБ/с (это потолок самого интерфейса SATA); NVMe PCIe 3.0 — до ~3 500, PCIe 4.0 — до ~7 000, PCIe 5.0 — 10 000+ МБ/с.</li>
<li><b>Почему SSD ощущается быстрым.</b> Дело даже не в МБ/с, а во времени поиска: HDD тратит 5–10 мс, чтобы найти кусочек файла, SSD — около 0,05–0,1 мс. Windows при загрузке читает тысячи мелких файлов, тут HDD и проигрывает.</li>
<li><b>Ловушка:</b> M.2 — это форма разъёма, а не скорость. Бывают M.2 SATA (~550 МБ/с). Ищи в названии слово NVMe.</li>
<li><b>Диск 1 ТБ, а Windows показывает 931 ГБ.</b> Производитель считает 1 ТБ = 10¹² байт, Windows делит на 1024³. Никто не обманывает.</li>
<li><b>Износ:</b> ячейки SSD стареют от записи (ресурс указан в TBW), но обычному пользователю его хватает на годы.</li></ul>`,

deep:`<ul>

deep:`<ul>

remember:['BIOS/UEFI — программа в микросхеме на плате, запускается первой','POST — самопроверка деталей при включении','Порядок загрузки решает, с какого диска стартовать','Настройки BIOS: XMP, вентиляторы, порядок загрузки'],
deep:`<ul>
<li><b>UEFI</b> — современная замена старого BIOS: понимает большие диски (GPT), поддерживает Secure Boot, умеет мышь и графику. По привычке его всё равно зовут BIOS.</li>
<li><b>Как войти:</b> сразу после включения жми Del или F2 (у ноутбуков бывает F2, F10, Esc). Из Windows 11: Параметры → Система → Восстановление → Особые варианты загрузки → Перезагрузить сейчас → Поиск и устранение неисправностей → Дополнительные параметры → Параметры встроенного ПО UEFI.</li>
<li><b>Лампочки Debug LED</b> на плате: CPU, DRAM, VGA, BOOT. Застряла на DRAM — чаще всего планка плохо вставлена, стоит не в тех слотах или несовместима.</li>
<li><b>Новая сборка на DDR5</b> при первом включении может минуту-две показывать чёрный экран: идёт «тренировка памяти». Это нормально — не выключай.</li>
<li><b>Батарейка CR2032</b> на плате хранит часы. Время постоянно сбивается — меняй батарейку. Сброс настроек (Clear CMOS) помогает, если после изменений компьютер перестал стартовать.</li>
<li><b>Обновлять BIOS</b> стоит при причине: поддержка нового процессора, исправление ошибок или уязвимостей. Во время обновления нельзя отключать питание.</li></ul>`,
quiz:[
 {q:'Что запускается первым при включении?',a:['Windows','BIOS/UEFI','Видеокарта'],c:1,w:'Сначала прошивка платы проверяет железо, потом ищет и запускает систему.'},
 {q:'На плате горит лампочка DRAM, экран чёрный. Что проверить первым?',a:['Переустановить планки памяти и проверить слоты','Переустановить Windows','Заменить монитор'],c:0,w:'Лампочка показывает, на каком этапе POST застрял. До Windows дело не дошло.'},
 {q:'Новый ПК на DDR5 при первом старте минуту показывает чёрный экран. Что это?',a:['Сломан','Тренировка памяти — нужно подождать'],c:1,w:'Плата подбирает параметры работы с новыми планками. Это бывает один раз после сборки или сброса.'}
]},

deep:`<ul>
<li><b>Почему нагрев растёт так быстро:</b> мощность ≈ ёмкость × напряжение² × частота. +10 % напряжения — это уже примерно +21 % мощности, а вместе с ростом частоты ещё больше.</li>
<li><b>Что можно разгонять:</b> у Intel — процессоры с буквой K, на платах Z-серии; у AMD Ryzen — почти все, на платах B и X. Ноутбуки обычно нельзя.</li>
<li><b>Выигрыш сегодня скромный.</b> Производители сами выжимают почти максимум автоматическим бустом. Типичная прибавка — 0–10 %. Для работы и учёбы она редко заметна, а риск реальный.</li>
<li><b>Андервольтинг</b> — разгон наоборот: снизить напряжение при той же частоте. Холоднее, тише, часто без потери скорости. Популярен на ноутбуках и видеокартах.</li>
<li><b>Проверка стабильности:</b> часы нагрузки в OCCT, Prime95 или y-cruncher; для памяти — TestMem5 или MemTest86. Ошибки памяти могут тихо портить файлы, поэтому для рабочего ПК стабильность важнее лишних процентов.</li>
<li><b>Гарантия:</b> разгон процессора производители часто исключают из гарантии. XMP/EXPO на практике считается нормой.</li></ul>`,
quiz:[

 {q:'После разгона ПК иногда сам перезагружается. Что это значит?',a:['Разгон нестабилен — нужно откатить настройки','Так и должно быть','Мало места на диске'],c:0,w:'Самопроизвольные перезагрузки и зависания — главный признак нестабильности.'},

 W(bar('Офис и учёба',[['Процессор (встройка)',30,'f-yel'],['Плата',18,'f-wood'],['Оперативка',15,'f-grn'],['SSD',12,'f-mint'],['Блок питания',12,'f-gray'],['Корпус',13,'f-coral']],'16 ГБ · SSD 512 ГБ · без видеокарты'),'data-tag="office"')+
 W(bar('Монтаж и нейросети',[['Видеокарта',35,'f-blue'],['Процессор',22,'f-yel'],['Оперативка',14,'f-grn'],['Плата',10,'f-wood'],['SSD',9,'f-mint'],['Блок питания',6,'f-gray'],['Корпус и кулер',4,'f-coral']],'32–64 ГБ · NVMe 1–2 ТБ · VRAM от 12 ГБ'),'data-tag="create"')+
 W(bar('Игры',[['Видеокарта',45,'f-blue'],['Процессор',18,'f-yel'],['Плата',10,'f-wood'],['Оперативка',8,'f-grn'],['SSD',7,'f-mint'],['Блок питания',7,'f-gray'],['Корпус и кулер',5,'f-coral']],'16–32 ГБ · NVMe 1 ТБ'),'data-tag="game"')+
 W(pr(18,'Процессор AM5','Плата AM5',.2)+pr(62,'Память DDR5','Плата под DDR5',.7)+pr(106,'ПК берёт ~450 Вт','БП 650 Вт',1.2)+pr(150,'Видеокарта 300 мм','Корпус до 340 мм',1.7),'data-tag="compat"');
},

remember:['Сначала задача, потом детали','Игры — главное видеокарта; нейросети — объём VRAM','Офис — SSD и 16 ГБ, видеокарта не нужна','Совместимость: сокет, DDR4/DDR5, ватты, размеры'],
deep:`<p>Доли бюджета — ориентир, а не закон. Цены меняются каждый месяц и в каждом городе свои, поэтому считай пропорции, а суммы проверяй в местных магазинах в день покупки.</p><ul>
<li><b>Порядок выбора:</b> задача → бюджет → видеокарта и процессор → плата под сокет → память под плату → блок питания под потребление → корпус под размеры.</li>
<li><b>Не экономь на блоке питания:</b> дешёвый может выйти из строя и потянуть за собой другие детали.</li>
<li><b>Память ставь сразу двумя планками</b> нужного объёма (например, 2×16 ГБ). Четыре планки DDR5 часто приходится запускать на меньшей скорости.</li>
<li><b>Для нейросетей</b> видеокарту выбирают по объёму VRAM. Большинство программ для локальных моделей лучше всего поддерживают видеокарты NVIDIA (CUDA).</li>
<li><b>Совместимость</b> удобно проверить в конфигураторах вроде PCPartPicker: цены там зарубежные, но проверка сокетов, размеров и мощности работает.</li></ul>`,
quiz:[
 {q:'Для игрового ПК наибольшую часть бюджета обычно отдают…',a:['видеокарте','корпусу','SSD'],c:0,w:'Количество кадров в играх в первую очередь упирается в видеокарту.'},
 {q:'Для локальных нейросетей в видеокарте важнее всего…',a:['объём видеопамяти (VRAM)','RGB-подсветка','число вентиляторов'],c:0,w:'Модель должна поместиться в VRAM, иначе работает в разы медленнее или не запускается.'},
 {q:'Купил процессор под сокет AM5 и плату LGA1700. Соберётся?',a:['Да','Нет — разные сокеты'],c:1,w:'AM5 — это AMD, LGA1700 — Intel. Физически не совместимы.'}
]},

 return W(key(40,76,'Ctrl',0)+T(130,110,'+','td','font-size:18px')+key(146,80,'Shift',.15)+T(240,110,'+','td','font-size:18px')+key(256,60,'Esc',.3)+T(180,170,'откроется Диспетчер задач','td','font-size:13px'),'data-tag="keys"')+
 W(`<rect x="16" y="12" width="328" height="190" rx="8" class="f-card o"/><path d="M17.5 32H342.5" class="o1"/>`+T(28,26,'Диспетчер задач — Производительность','tl','font-size:9px')+
  item(42,'ЦП','12% · 3,6 ГГц')+item(74,'Память','9,1/16 ГБ (57%)')+item(106,'Диск 0 (C:)','SSD (NVMe) · 2%')+item(138,'Графический процессор 0','4%')+
  T(142,52,'Память','tl td','font-size:12px')+T(334,52,'16,0 ГБ DDR4','te tm','font-size:8px')+
  `<rect x="142" y="60" width="192" height="62" rx="3" class="f-paper o1"/><path d="M142 80.5H334M142 101.5H334M206 60V122M270 60V122" class="o1" opacity=".25"/>`+
  field(250,140,'Скорость: 3200 МТ/с')+field(250,154,'Гнёзд: 2 из 4')+field(250,168,'Форм-фактор: DIMM'),'data-tag="win"')+
 W(`<polyline points="142,90 158,88 174,86 190,89 206,84 222,86 238,85 254,88 270,84 286,86 302,85 318,87 334,86" class="nf" style="stroke:var(--blue);stroke-width:2"/>`+field(142,140,'Используется: 9,1 ГБ')+field(142,154,'Доступно: 6,9 ГБ')+field(142,168,'Кэшировано: 4,2 ГБ'),'data-tag="norm"')+
 W(`<polyline points="142,70 158,67 174,66 190,65 206,64 222,66 238,64 254,63 270,65 286,64 302,63 318,64 334,64" class="nf" style="stroke:var(--red);stroke-width:2.5"/>`+T(330,76,'93%','te tm tr','font-size:11px')+field(142,140,'Используется: 14,9 ГБ','tr')+field(142,154,'Доступно: 1,1 ГБ','tr')+field(142,168,'Кэшировано: 0,4 ГБ')+T(180,192,'Всегда выше 85–90 % — стол мал','td tr','font-size:10px'),'data-tag="busy"')+
 W(`<rect x="21" y="71" width="114" height="32" rx="6" class="hl pulse"/><rect x="245" y="130" width="94" height="44" rx="6" class="hl pulse"/>`,'data-tag="hmem"');
},

],
remember:['Ctrl + Shift + Esc → «Производительность»','Память: объём, скорость, свободные гнёзда','Диск: SSD или HDD','ЦП: число ядер и логических процессоров'],
deep:`<ul>
<li><b>Модель и тайминги планок</b> покажет бесплатная программа CPU-Z: вкладка SPD — каждая планка отдельно, вкладка Memory — текущая частота (помни: там половина от МТ/с).</li>
<li><b>Перед покупкой памяти выпиши:</b> поколение (DDR4/DDR5), скорость, объём уже стоящих планок и форм-фактор (DIMM — для ПК, SODIMM — для ноутбука). Лучше всего брать одинаковые планки комплектом.</li>
<li><b>«Использовано гнёзд: 1 из 1»</b> или вовсе нет этой строки в ноутбуке — память, скорее всего, частично или полностью распаяна.</li>
<li>В Windows 11 скорость может быть подписана «МТ/с», в старых версиях — «МГц». Число при этом то же (3200).</li></ul>`,
quiz:[
 {q:'Где в Windows посмотреть скорость оперативки и свободные слоты?',a:['Диспетчер задач → Производительность → Память','Панель задач → Часы','Проводник → Загрузки'],c:0,w:'Быстрый вход — Ctrl + Shift + Esc.'},
 {q:'Память стабильно занята на 90 %+. Что логично сделать первым?',a:['Заменить блок питания','Посмотреть в «Процессах», что ест память, и закрыть лишнее','Купить новый процессор'],c:1,w:'Сначала найди причину. Если всё нужное и памяти всё равно мало — тогда докупать.'}
]}

/* ---------- state ---------- */
const KEY='pc-kitchen-v1';
let store={ans:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.ans)store=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
let ep=0,fr=0,timer=null,seen=new Set();
const $=id=>document.getElementById(id);

const isDone=i=>EP[i].quiz.every((q,j)=>store.ans[`${i}-${j}`]!==undefined);
function renderNav(){
  $('eps').innerHTML=EP.map((e,i)=>`<button type="button" class="chip${i===ep?' cur':''}${isDone(i)?' done':''}" data-i="${i}" aria-current="${i===ep}"><span class="n"><span>${i+1}</span></span>${e.name}</button>`).join('');
  const d=EP.filter((_,i)=>isDone(i)).length;
  $('prog').textContent=`Пройдено ${d} из ${EP.length}`;
  $('progbar').style.width=(d/EP.length*100)+'%';
}
function renderQuiz(){
  const e=EP[ep];let right=0,answered=0;
  $('quiz').innerHTML=e.quiz.map((q,j)=>{
    const a=store.ans[`${ep}-${j}`];const has=a!==undefined;if(has){answered++;if(a===q.c)right++}
    return `<div class="q"><p>${q.q}</p>${q.a.map((o,k)=>`<button type="button" class="opt${has&&k===q.c?' right':''}${has&&k===a&&a!==q.c?' wrong':''}" data-q="${j}" data-k="${k}" ${has?'disabled':''}>${o}</button>`).join('')}
    ${has?`<p class="why${a===q.c?'':' no'}"><b>${a===q.c?'Верно.':'Не совсем.'}</b> ${q.w}</p>`:''}</div>`}).join('')+
    `<div class="qfoot"><span>${answered?`Верно ${right} из ${e.quiz.length}`:`${e.quiz.length} вопроса`}</span>${answered?'<button type="button" class="link" id="reset">Ответить заново</button>':''}</div>`;
}
function renderEp(){
  const e=EP[ep];fr=0;seen=new Set();
  $('epnum').textContent=`СЕРИЯ ${ep+1} / ${EP.length}`;
  $('eptitle').textContent=e.title;
  $('stage').innerHTML=svgWrap(e.scene());
  $('rem').innerHTML=e.remember.map(r=>`<li>${r}</li>`).join('');
  $('deep').innerHTML=e.deep;
  $('dots').innerHTML=e.frames.map(()=>'<i></i>').join('');
  const nx=EP[ep+1];
  $('nextep').hidden=!nx; if(nx)$('nextep').textContent=`Следующая серия: ${nx.name} →`;
  renderNav();renderQuiz();applyFrame();
}
function applyFrame(){
  const e=EP[ep],f=e.frames[fr],svg=$('stage').querySelector('svg');
  seen.add(fr);
  svg.setAttribute('class',(f.cls||'')+((f.focus&&f.focus.length)?' dim':''));
  svg.querySelectorAll('.actor').forEach(a=>a.classList.toggle('on',!!(f.focus&&f.focus.includes(a.id))));
  const show=f.show||[];
  svg.querySelectorAll('[data-tag]').forEach(el=>{
    const vis=el.getAttribute('data-tag').split(' ').some(t=>show.includes(t));
    if(vis)el.removeAttribute('hidden');else el.setAttribute('hidden','');
  });
  $('subtext').innerHTML=f.t;
  [...$('dots').children].forEach((d,i)=>{d.className=i===fr?'cur':(seen.has(i)?'seen':'')});
  $('prev').disabled=fr===0;
  $('next').textContent=fr<e.frames.length-1?'Дальше':'К вопросам';
}
function go(d){
  const n=EP[ep].frames.length;
  if(d>0&&fr===n-1){stopAuto();document.querySelector('.quiz').scrollIntoView({behavior:'smooth',block:'start'});return}
  fr=Math.max(0,Math.min(n-1,fr+d));applyFrame();
}
function stopAuto(){clearInterval(timer);timer=null;$('play').classList.remove('on');$('play').textContent='Авто'}
function setEp(i,push=true){stopAuto();ep=i;renderEp();if(push){try{history.replaceState(null,'','#ep-'+(i+1))}catch(e){location.hash='ep-'+(i+1)}}}

$('prev').onclick=()=>{stopAuto();go(-1)};
$('next').onclick=()=>{stopAuto();go(1)};
$('play').onclick=()=>{
  if(timer){stopAuto();return}
  $('play').classList.add('on');$('play').textContent='Пауза';
  if(fr===EP[ep].frames.length-1){fr=0;applyFrame()}
  timer=setInterval(()=>{if(fr<EP[ep].frames.length-1){fr++;applyFrame()}else stopAuto()},6500);
};
$('eps').onclick=ev=>{const b=ev.target.closest('.chip');if(b)setEp(+b.dataset.i)};
$('nextep').onclick=()=>{if(ep<EP.length-1){setEp(ep+1);window.scrollTo({top:0,behavior:'smooth'})}};
$('quiz').onclick=ev=>{
  const o=ev.target.closest('.opt');
  if(o){store.ans[`${ep}-${o.dataset.q}`]=+o.dataset.k;save();renderQuiz();renderNav();return}
  if(ev.target.id==='reset'){EP[ep].quiz.forEach((_,j)=>delete store.ans[`${ep}-${j}`]);save();renderQuiz();renderNav()}
};
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('button')&&(ev.key===' '||ev.key==='Enter'))return;
  if(ev.key==='ArrowRight'){stopAuto();go(1)}else if(ev.key==='ArrowLeft'){stopAuto();go(-1)}
});
function fromHash(){const m=/^#ep-(\d+)$/.exec(location.hash);const i=m?Math.min(EP.length,Math.max(1,+m[1]))-1:0;if(i!==ep||!$('stage').firstChild){ep=i;renderEp()}}
window.addEventListener('hashchange',fromHash);
ep=-1;fromHash();
</script>
